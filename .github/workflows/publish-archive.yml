name: Publish archived versions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-archive.yml'
      - 'scripts/publish-archive.py'
      - 'release-manifest.json'
      - 'archive-refs.json'
      - 'release-assets/**'
      - 'release-notes/**'

permissions:
  contents: write

concurrency:
  group: publish-archived-versions
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify archive
        run: python3 scripts/publish-archive.py --check
      - name: Publish six experimental releases
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_TARGET_SHA: ${{ github.sha }}
        run: python3 scripts/publish-archive.py
