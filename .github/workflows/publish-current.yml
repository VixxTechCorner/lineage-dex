name: Publish current version

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-current.yml'
      - 'scripts/publish-current.py'
      - 'release-current.json'
      - 'releases/**'

permissions:
  contents: write

concurrency:
  group: publish-current-version
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify current build and source archive
        run: python3 scripts/publish-current.py --check
      - name: Publish experimental release with verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.sha }}
        run: python3 scripts/publish-current.py
